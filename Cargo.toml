# Project:   dfe-clickhouse-rs
# File:      Cargo.toml
# Purpose:   Crate manifest, feature layers and dependency policy
# Language:  TOML
#
# License:   Apache-2.0
# Copyright: (c) 2026 HYPERI PTY LIMITED

[package]
name = "dfe-clickhouse"
version = "0.1.0"
edition = "2024"
# Upstream's MSRV. Keep in step with rust-toolchain.toml.
rust-version = "1.89.0"
description = "HyperI extensions for the official ClickHouse Rust client: TCP transport, dynamic inserts, unified client"
authors = ["HYPERI PTY LIMITED <dev@hyperi.io>"]
license = "Apache-2.0"
repository = "https://github.com/hyperi-io/dfe-clickhouse-rs"
documentation = "https://docs.rs/dfe-clickhouse"
# The crates.io page. README.md stays the GitHub front page and the docs.rs crate docs.
readme = "docs/crate.md"
publish = true
keywords = ["clickhouse", "database", "tcp", "tokio"]
categories = ["database", "asynchronous"]
# `docs/` ships: it is 24K, the type-support and insert-format pages are
# consumer-facing, and `src/native/mod.rs` and `src/tcp/pool.rs` point at
# `docs/coverage.md` -- excluding it left those references dangling in the
# published tarball. `.github/` and `.githooks/` are repo machinery and stay out.
exclude = [".github/", ".githooks/"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# The HTTP client is the default story: upstream's `clickhouse::Client` plus
# our extension traits. `ext` pulls no dependencies of its own, and the native
# transport is a deliberate opt-in rather than something every consumer pays
# for. Adding to this set later is non-breaking; removing from it is not.
default = ["lz4", "ext"]
tcp = ["dep:deadpool", "dep:socket2", "dep:backon"]
tls = [
    "tcp",
    "dep:rustls",
    "dep:tokio-rustls",
    "dep:rustls-pki-types",
    "dep:webpki-roots",
    "dep:rustls-native-certs",
]
# Block compression is upstream's; this crate negotiates `None` on TCP.
lz4 = ["clickhouse/lz4"]
zstd = ["clickhouse/zstd"]
# `ext` carries the server-exception parser the insert-error classifier reads
# the ClickHouse error code out of.
dynamic = ["dep:serde_json", "ext"]
unified = ["tcp"]
ext = []
full = [
    "tcp",
    "tls",
    "lz4",
    "zstd",
    "dynamic",
    "unified",
    "ext",
]

[dependencies]
# The only link to upstream: a crates.io release, never git/path/[patch].
clickhouse = { version = "0.15.3", default-features = false }

serde = { version = ">=1.0.229, <2", features = ["derive"] }
bytes = ">=1.12.1, <2"
thiserror = ">=2.0.21, <3"
tracing = { version = ">=0.1.44, <0.2", default-features = false, features = ["std"] }
futures-util = { version = ">=0.3.34, <0.4", default-features = false }
tokio = { version = ">=1.54.1, <2", features = ["rt", "macros", "io-util", "sync", "net", "time"] }

# tcp
deadpool = { version = ">=0.13.1, <0.14", default-features = false, features = ["managed", "rt_tokio_1"], optional = true }
# 0.6 shares the socket2 that tokio and hyper-util already resolve to.
socket2 = { version = ">=0.6.5, <0.7", features = ["all"], optional = true }
# Retry/backoff, matching scalo-rs. Jitter is the reason: a hand-rolled
# schedule desynchronises nothing, so a pool-wide reconnect storm retries
# in lockstep.
backon = { version = ">=1.6.0, <2", default-features = false, features = ["std", "tokio-sleep"], optional = true }

# tls
rustls = { version = ">=0.23.46, <0.24", default-features = false, features = ["std", "tls12", "logging", "aws_lc_rs"], optional = true }
tokio-rustls = { version = ">=0.26.6, <0.27", default-features = false, features = ["aws_lc_rs", "tls12", "logging"], optional = true }
rustls-pki-types = { version = ">=1.15.1, <2", features = ["std"], optional = true }
# 1.x, not the 0.26 shim over it: the shim carried a second webpki-roots copy.
webpki-roots = { version = ">=1.0.11, <2", optional = true }
rustls-native-certs = { version = ">=0.8.5, <0.9", optional = true }

# dynamic
serde_json = { version = ">=1.0.154, <2", optional = true }

[dev-dependencies]
# `-native-roots` only picks the trust source; the HTTPS connector needs `-aws-lc` too.
clickhouse = { version = "0.15.3", default-features = false, features = ["test-util", "rustls-tls-aws-lc", "rustls-tls-native-roots"] }
tokio = { version = ">=1.54.1, <2", features = ["full", "test-util"] }
serde_json = ">=1.0.154, <2"
dotenvy = ">=0.15.7, <0.16"
static_assertions = ">=1.1, <2"
tempfile = ">=3.27.0, <4"
# Wire matrix only: `tests/wire_docker.rs` starts a pinned ClickHouse.
testcontainers = ">=0.28.0, <0.29"
proptest = { version = ">=1.12.0, <2", default-features = false, features = ["std", "bit-set"] }

# Upstream's lint set plus `unsafe_code = "deny"`.
[lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unsafe_code = "deny"
missing_docs = "warn"

# Groups get priority = -1 so an individual lint level always wins.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
unwrap_used = "deny"
expect_used = "deny"
missing_safety_doc = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"

[lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"
invalid_codeblock_attributes = "warn"
invalid_rust_codeblocks = "warn"
bare_urls = "warn"
