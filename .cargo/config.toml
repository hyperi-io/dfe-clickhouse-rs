# Target sections, because a runner's CARGO_TARGET_<TRIPLE>_RUSTFLAGS discards `[build]` rustflags.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-D", "warnings"]

[target.aarch64-unknown-linux-gnu]
rustflags = ["-D", "warnings"]

# Fallback for hosts with no target section above, such as macOS.
[build]
rustflags = ["-D", "warnings"]
