# Project:   dfe-clickhouse-rs
# File:      .hyperi-ci.yaml
# Purpose:   HyperI CI configuration
#
# License:   Apache-2.0
# Copyright: (c) 2026 HYPERI PTY LIMITED
#
# Defaults: config/defaults.yaml in hyperi-ci. Override with HYPERCI_* env vars.

classification: oss

language: rust
license: Apache-2.0
quality:
  enabled: true
test:
  enabled: true
  # docs/coverage.md says why.
  coverage: false
  rust:
    nextest: true
build:
  enabled: true
  strategies:
  - native
  rust:
    # What `-D warnings` reaches: CONTRIBUTING.md, "Commands that prove a change".
    features: all
    targets: []
release:
  enabled: true
